<!-- Page styling, ported from the Claude Design version of the page (Oct 2026).
     step07_render.py puts the title and social-card tags before this. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#161826; --surface:#232532; --text:#e9e9ed; --section:#262a60;
  --n100:#f3f5fe; --n200:#e4e7f5; --n300:#cfd3e5; --n400:#b2b6ca; --n500:#9397ab;
  --n600:#75798c; --n700:#595d6c; --n800:#3f424d; --n900:#292b31;
  --a200:#e7e5fe; --a300:#d2cefd; --a400:#b5abfc; --a500:#968ae0; --a700:#5d5294; --a900:#2b2741;
  --rs:4px; --rm:8px;
  --rule:linear-gradient(to right,transparent,rgba(233,233,237,.16) 48px,rgba(233,233,237,.16) calc(100% - 48px),transparent);
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--a300);text-decoration:none}
a:hover{color:var(--a200);text-decoration:underline}
::selection{background:rgba(145,132,217,.3)}
:focus{outline:none}
:focus-visible{outline:2px solid #9184d9;outline-offset:2px}
.wrap{max-width:920px;margin:0 auto;padding:0 24px}
h1,h2{font-weight:500;letter-spacing:-.03em;line-height:1.04;margin:0}

header{padding:64px 0 40px}
.kicker{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--a400);margin-bottom:24px}
h1{font-size:clamp(34px,6vw,56px);max-width:12em;margin-bottom:24px;text-wrap:balance}
.lede{font-size:clamp(16px,2.2vw,19px);line-height:1.55;max-width:34em;margin:0 0 18px;color:var(--n200)}
.note{font-size:15px;line-height:1.65;max-width:36em;margin:0 0 12px;color:var(--n400)}
.note:last-child{margin-bottom:0}

.band{background:var(--section)}
.band .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));padding-top:4px;padding-bottom:4px}
.stat{display:flex;flex-direction:column;gap:4px;padding:22px 0;min-width:0}
.stat b{font-size:30px;font-weight:500;line-height:1;letter-spacing:-.02em;color:var(--n100);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;line-height:1.35;letter-spacing:.07em;text-transform:uppercase;color:var(--a300)}

.controls{position:sticky;top:0;z-index:5;background:var(--bg)}
.controls .wrap{padding-top:20px;padding-bottom:18px;display:flex;flex-direction:column;gap:14px}
#q{width:100%;font:inherit;font-size:16px;padding:13px 18px;border-radius:var(--rm);
  border:1px solid var(--n800);background:var(--surface);color:var(--text)}
#q::placeholder{color:var(--n600)}
#q:hover{border-color:var(--n700)}
.checks{display:flex;flex-wrap:wrap;gap:10px 24px}
.checks label{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.4;cursor:pointer;color:var(--n300)}
.checks input{margin:2px 0 0;accent-color:#9184d9}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 12px;border-radius:var(--rs);
  border:1px solid var(--n800);color:var(--n300);text-decoration:none}
.chip:hover{border-color:var(--a500);color:var(--a200);text-decoration:none}
.chip b{font-weight:400;color:var(--a400);font-variant-numeric:tabular-nums}
.edge{height:1px;background-image:var(--rule)}

main{padding-bottom:8px}
section{padding:44px 0 8px;scroll-margin-top:190px}
h2{font-size:clamp(24px,3.4vw,31px);letter-spacing:-.025em;margin-bottom:6px}
.blurb{font-size:15px;line-height:1.6;color:var(--n500);max-width:34em;margin:0 0 4px}
.range{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--n600);margin:0 0 8px}

.row{display:flex;flex-direction:column;gap:6px;padding:22px 0;
  background-image:linear-gradient(to right,transparent,rgba(233,233,237,.14) 48px,rgba(233,233,237,.14) calc(100% - 48px),transparent);
  background-size:100% 1px;background-repeat:no-repeat}
.rowhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.rowtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;flex:1 1 260px;min-width:0}
.rowtitle a{font-size:clamp(19px,2.6vw,23px);font-weight:500;line-height:1.15;letter-spacing:-.02em;color:var(--text)}
.rowtitle a:hover{color:var(--a300);text-decoration:none}
.flag{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--n400);
  border:1px solid var(--n700);padding:2px 7px;border-radius:var(--rs)}
.rowmeta{font-size:12px;color:var(--n500);font-variant-numeric:tabular-nums;white-space:nowrap}
.entitle{font-size:15px;color:var(--a300);margin-top:-2px}
.desc{font-size:15px;line-height:1.6;margin:4px 0 0;max-width:40em;color:var(--n200)}
.endesc{font-size:14px;line-height:1.6;margin:8px 0 0;max-width:40em;padding-left:16px;
  border-left:1px solid var(--a700);color:var(--n500)}
body.no-en .en{display:none}
.row.hide,section.hide{display:none}
#empty{font-size:16px;color:var(--n400);padding:48px 0;display:none}
#empty.show{display:block}
#empty b{color:var(--text);font-weight:600}

footer{padding:64px 0 96px;display:flex;flex-direction:column;gap:14px}
footer .edge{margin-bottom:10px}
footer h2{font-size:20px;letter-spacing:-.02em}
footer ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;
  font-size:14px;line-height:1.6;color:var(--n400);max-width:40em}
.colophon{font-size:13px;line-height:1.6;color:var(--n600);margin:12px 0 0;max-width:40em}
@media (max-width:520px){
  header{padding-top:44px}
  .wrap{padding:0 18px}
  section{scroll-margin-top:240px}
}
</style>
