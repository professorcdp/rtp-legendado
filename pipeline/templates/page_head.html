<!-- Page styling: the "azulejo" palette and fonts shared with Jim's NúmerosPT project
     (docs/decisions/0007-azulejo-palette.md). Light = cream tile with cobalt lettering;
     dark = cobalt glaze with cream lettering; gold is the constant accent.
     The fonts are embedded rather than loaded from Google (issue #14).
     step07_render.py puts the title and social-card tags before this. -->
<script>
/* Apply a remembered light/dark choice before first paint, so there's no flash of the
   wrong scheme. No stored choice = follow the device. */
try{var t=localStorage.getItem('rtp-legendado-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}
</script>
